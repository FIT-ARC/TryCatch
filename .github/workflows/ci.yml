name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 3.47.5 ships a matched engine/impellerc pair (shader bundle format v2),
  # verified on-device for the flutter_scene GPU path.
  FLUTTER_VERSION: "3.47.5"

jobs:
  analyze-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub get --directory=packages/dead_reckoning
          flutter pub get --directory=packages/serial

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test dead_reckoning (pure Dart)
        run: dart test
        working-directory: packages/dead_reckoning
