name: trycatch
description: "Ground station software for model rockets developed by Testing in Production"
publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ^3.13.1

dependencies:
    flutter:
        sdk: flutter

    flutter_riverpod: ^3.4.3

    fl_chart: ^1.2.0

    vector_math: ^2.1.4

    flutter_map: ^8.3.1
    latlong2: ^0.10.1

    flutter_libserialport: ^0.6.0

    crypto: ^3.0.0

    shared_preferences: ^2.3.2
    path_provider: ^2.1.5
    window_manager: ^0.5.2
    tray_manager: ^0.7.0

    serial:
        path: packages/serial
    dead_reckoning:
        path: packages/dead_reckoning
    qr_flutter: ^4.1.0

dev_dependencies:
    flutter_test:
        sdk: flutter

    fake_async: ^1.3.1
    flutter_lints: ^6.0.0
    flutter_launcher_icons: ^0.14.4
    msix: ^3.18.0

flutter:
    uses-material-design: true

    assets:
        - assets/icon.png
        - assets/icon.ico
        # Sample flights: every .bin in this directory is listed read-only in
        # Recorded flights and replayed straight from the asset (never copied).
        # Assets are bundled at build time, so adding/removing a file needs a
        # full restart (a hot reload keeps the previous asset bundle).
        - assets/recordings/

flutter_launcher_icons:
    image_path: "assets/icon.png"
    windows:
        generate: true
        image_path: "assets/icon.png"
    macos:
        generate: true
        image_path: "assets/icon.png"

# Windows MSIX installer (package:msix). Architecture, version, certificate
# and output name are supplied by CI (.github/workflows/release.yml);
# publisher CN must match the signing certificate subject.
msix_config:
    display_name: TryCatch
    publisher_display_name: Testing in Production
    identity_name: com.krychlic.trycatch
    publisher: CN=Testing in Production
    logo_path: assets/icon.png
    capabilities: internetClient
    execution_alias: trycatch
